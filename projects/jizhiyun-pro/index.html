#globalLoader{position:fixed;inset:0;z-[9999];display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%);overflow:hidden;transition:opacity .6s ease,visibility .6s ease}
#globalLoader::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(51,115,255,.15) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation:pulseGlow 3s ease-in-out infinite}
#globalLoader::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:40px 40px;animation:gridMove 20s linear infinite}
@keyframes pulseGlow{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.6}50%{transform:translate(-50%,-50%) scale(1.2);opacity:1}}
@keyframes gridMove{0%{background-position:0 0}100%{background-position:40px 40px}}
.loader-logo{position:relative;z-index:2;display:flex;align-items:center;gap:14px;margin-bottom:40px}
.loader-logo i{font-size:48px;background:linear-gradient(135deg,#3373ff,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:logoFloat 2s ease-in-out infinite}
.loader-logo span{font-size:32px;font-weight:800;color:#fff;letter-spacing:2px}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.loader-progress-wrap{position:relative;z-index:2;width:320px;max-width:80vw}
.loader-progress-bar{width:100%;height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;position:relative}
.loader-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#3373ff,#8b5cf6,#ec4899);border-radius:99px;transition:width .3s ease;position:relative;box-shadow:0 0 20px rgba(51,115,255,.6)}
.loader-progress-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.loader-progress-info{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.loader-percent{font-size:24px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.loader-tip{font-size:13px;color:rgba(255,255,255,.5);margin-top:24px;text-align:center;z-index:2;position:relative;min-height:20px;transition:opacity .3s}
.loader-hide{opacity:0!important;visibility:hidden!important;pointer-events:none}
/* 颜色切换 */
.loader-theme-switcher{position:absolute;bottom:40px;right:40px;z-index:10;display:flex;align-items:center;gap:10px}
.loader-theme-btn{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:linear-gradient(135deg,rgba(51,115,255,.3),rgba(139,92,246,.3));color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;backdrop-filter:blur(10px);font-size:20px;box-shadow:0 0 20px rgba(51,115,255,.4);animation:btnPulse 2s ease-in-out infinite}
.loader-theme-btn:hover{background:linear-gradient(135deg,rgba(51,115,255,.5),rgba(139,92,246,.5));transform:scale(1.1);box-shadow:0 0 30px rgba(51,115,255,.6)}
@keyframes btnPulse{0%,100%{box-shadow:0 0 20px rgba(51,115,255,.4)}50%{box-shadow:0 0 35px rgba(139,92,246,.7)}}
.loader-theme-label{color:rgba(255,255,255,.7);font-size:13px;font-weight:500;letter-spacing:1px;animation:labelFade 2s ease-in-out infinite}
@keyframes labelFade{0%,100%{opacity:.5}50%{opacity:1}}
.loader-theme-colors{position:absolute;bottom:60px;right:0;display:flex;gap:8px;padding:10px;border-radius:12px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);opacity:0;visibility:hidden;transform:translateY(10px);transition:all .3s}
.loader-theme-colors.show{opacity:1;visibility:visible;transform:translateY(0)}
.loader-theme-color{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.3);cursor:pointer;transition:all .2s;padding:0}
.loader-theme-color:hover{transform:scale(1.2);border-color:#fff}
.loader-theme-color.active{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.6)}
</style>

<!-- ===== 初始化 ===== -->
<script>
/* ===== 加载进度条控制器 ===== */
(function() {
  var fill = document.getElementById('loaderFill');
  var percentEl = document.getElementById('loaderPercent');
  var tipEl = document.getElementById('loaderTip');
  var progress = 0;
  var timer = null;
  var tips = ['正在初始化引擎...','正在加载核心模块...','正在连接数据服务...','正在渲染界面组件...','即将完成，请稍候...'];
  var tipIndex = 0;
  function setProgress(p) { progress = Math.min(100, Math.max(0, p)); if (fill) fill.style.width = progress + '%'; if (percentEl) percentEl.textContent = Math.floor(progress) + '%'; }
  function nextTip() { tipIndex = (tipIndex + 1) % tips.length; if (tipEl) { tipEl.style.opacity = '0'; setTimeout(function() { tipEl.textContent = tips[tipIndex]; tipEl.style.opacity = '1'; }, 300); } }
  function simulate() {
    if (progress >= 92) return;
    var inc = progress < 30 ? Math.random() * 8 + 4 : progress < 60 ? Math.random() * 5 + 2 : Math.random() * 2 + 0.5;
    setProgress(progress + inc);
    if (Math.floor(progress / 20) !== tipIndex && progress < 90) nextTip();
    timer = setTimeout(simulate, 200 + Math.random() * 300);
  }
  window.__loaderComplete = function() {
    if (timer) clearTimeout(timer);
    setProgress(100);
    if (tipEl) tipEl.textContent = '加载完成！';
    setTimeout(function() {
      var loader = document.getElementById('globalLoader');
      if (loader) loader.classList.add('loader-hide');
      setTimeout(function() { if (loader) loader.style.display = 'none'; }, 600);
    }, 400);
  };
  setTimeout(function() { if (progress < 100) window.__loaderComplete(); }, 8000);
  simulate();

/* ===== 颜色切换 ===== */
  var themes = {
    deepspace: 'linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%)',
    aurora: 'linear-gradient(135deg,#064e3b 0%,#134e4a 50%,#064e3b 100%)',
    sunset: 'linear-gradient(135deg,#7c2d12 0%,#9a3412 50%,#7c2d12 100%)',
    sakura: 'linear-gradient(135deg,#831843 0%,#9d174d 50%,#831843 100%)',
    royal: 'linear-gradient(135deg,#2e1065 0%,#4c1d95 50%,#2e1065 100%)',
    ocean: 'linear-gradient(135deg,#0c4a6e 0%,#075985 50%,#0c4a6e 100%)'
  };
  var savedTheme = localStorage.getItem('loaderTheme') || 'deepspace';
  var loaderEl = document.getElementById('globalLoader');
  if (loaderEl && themes[savedTheme]) loaderEl.style.background = themes[savedTheme];

  var themeBtn = document.getElementById('loaderThemeBtn');
  var themeColors = document.getElementById('loaderThemeColors');
  if (themeBtn && themeColors) {
    themeBtn.addEventListener('click', function(e) { e.stopPropagation(); themeColors.classList.toggle('show'); });
    document.addEventListener('click', function() { themeColors.classList.remove('show'); });
    var colorBtns = themeColors.querySelectorAll('.loader-theme-color');
    colorBtns.forEach(function(btn) {
      if (btn.dataset.theme === savedTheme) btn.classList.add('active'); else btn.classList.remove('active');
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var t = btn.dataset.theme;
        if (loaderEl && themes[t]) loaderEl.style.background = themes[t];
        localStorage.setItem('loaderTheme', t);
        colorBtns.forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
      });
    });
  }
})();

document.addEventListener('DOMContentLoaded', function () {
  // 主题初始化
  const isDark = App.Store.get('darkMode') === 'true';
  if (isDark) document.documentElement.classList.add('dark');
  const themeColor = App.Store.get('themeColor') || '#3373ff';
  App.setThemeColor(themeColor);
  const fontSize = App.Store.get('fontSize') || 16;
  if (document.getElementById('fontRange')) {
    document.getElementById('fontRange').value = fontSize;
  }
  App.setFontSize(fontSize);

  // 初始化 AOS 滚动动画
  if (window.AOS) {
    AOS.init({ duration: 700, once: true, offset: 60 });
  }

  // 渲染导航与页脚
  App.Components.renderNavbar();
  App.Components.renderFooter();

  // 启动路由
  App.Router.init();

  // 页面渲染完成，结束加载进度条
  setTimeout(() => { if (window.__loaderComplete) window.__loaderComplete(); }, 800);

  // 回到顶部按钮显隐 + 导航栏吸顶
  window.addEventListener('scroll', function () {
    const btn = document.getElementById('backToTop');
    if (btn) {
      if (window.scrollY > 400) { btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; }
      else { btn.style.opacity = '0'; btn.style.pointerEvents = 'none'; }
    }
    const nav = document.getElementById('navbar');
    if (nav) {
      if (window.scrollY > 10) nav.classList.add('nav-scrolled');
      else nav.classList.remove('nav-scrolled');
    }
  });
});
</script>

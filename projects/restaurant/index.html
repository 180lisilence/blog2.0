<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>餐厅学生管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/fancy.css">
    <script src="js/common.js"></script>

        tailwind.config = {darkMode:'class'}

<style>
#globalLoader{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%);overflow:hidden;transition:opacity .6s ease,visibility .6s ease;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
#globalLoader::before{content:"";position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(51,115,255,.15) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation:pulseGlow 3s ease-in-out infinite}
#globalLoader::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:40px 40px;animation:gridMove 20s linear infinite}
@keyframes pulseGlow{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.6}50%{transform:translate(-50%,-50%) scale(1.2);opacity:1}}
@keyframes gridMove{0%{background-position:0 0}100%{background-position:40px 40px}}
.loader-logo{position:relative;z-index:2;display:flex;align-items:center;gap:14px;margin-bottom:40px}
.loader-logo-icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#3373ff,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:bold;animation:logoFloat 2s ease-in-out infinite;box-shadow:0 8px 32px rgba(51,115,255,.4)}
.loader-logo span{font-size:32px;font-weight:800;color:#fff;letter-spacing:2px}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.loader-progress-wrap{position:relative;z-index:2;width:320px;max-width:80vw}
.loader-progress-bar{width:100%;height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;position:relative}
.loader-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#3373ff,#8b5cf6,#ec4899);border-radius:99px;transition:width .3s ease;position:relative;box-shadow:0 0 20px rgba(51,115,255,.6)}
.loader-progress-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.loader-progress-info{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.loader-percent{font-size:24px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.loader-tip{font-size:13px;color:rgba(255,255,255,.5);margin-top:24px;text-align:center;z-index:2;position:relative;min-height:20px;transition:opacity .3s}
.loader-hide{opacity:0!important;visibility:hidden!important;pointer-events:none}
.loader-theme-switcher{position:absolute;bottom:40px;right:40px;z-index:10;display:flex;align-items:center;gap:10px}
.loader-theme-btn{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:linear-gradient(135deg,rgba(51,115,255,.3),rgba(139,92,246,.3));color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;backdrop-filter:blur(10px);font-size:20px;box-shadow:0 0 20px rgba(51,115,255,.4);animation:btnPulse 2s ease-in-out infinite}
.loader-theme-btn:hover{background:linear-gradient(135deg,rgba(51,115,255,.5),rgba(139,92,246,.5));transform:scale(1.1);box-shadow:0 0 30px rgba(51,115,255,.6)}
@keyframes btnPulse{0%,100%{box-shadow:0 0 20px rgba(51,115,255,.4)}50%{box-shadow:0 0 35px rgba(139,92,246,.7)}}
.loader-theme-label{color:rgba(255,255,255,.7);font-size:13px;font-weight:500;letter-spacing:1px;animation:labelFade 2s ease-in-out infinite}
@keyframes labelFade{0%,100%{opacity:.5}50%{opacity:1}}
.loader-theme-colors{position:absolute;bottom:60px;right:0;display:flex;gap:8px;padding:10px;border-radius:12px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);opacity:0;visibility:hidden;transform:translateY(10px);transition:all .3s}
.loader-theme-colors.show{opacity:1;visibility:visible;transform:translateY(0)}
.loader-theme-color{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.3);cursor:pointer;transition:all .2s;padding:0}
.loader-theme-color:hover{transform:scale(1.2);border-color:#fff}
.loader-theme-color.active{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.6)}
.loader-sun-btn{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,200,50,.6);background:linear-gradient(135deg,#ffd700,#ff8c00);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;font-size:18px;box-shadow:0 0 15px rgba(255,200,50,.5);animation:sunSpin 4s linear infinite}
.loader-sun-btn:hover{transform:scale(1.15);box-shadow:0 0 25px rgba(255,200,50,.8)}
@keyframes sunSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.loader-sun-btn:hover{animation-play-state:paused}
/* 浅色模式 */
#globalLoader.light-mode{background:linear-gradient(135deg,#f0f4ff 0%,#e8e0ff 50%,#f0f4ff 100%)!important}
#globalLoader.light-mode::before{background:radial-gradient(circle,rgba(51,115,255,.1) 0%,transparent 70%)!important}
#globalLoader.light-mode::after{background-image:linear-gradient(rgba(0,0,0,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.03) 1px,transparent 1px)!important}
#globalLoader.light-mode .loader-logo span{color:#1e293b!important}
#globalLoader.light-mode .loader-logo-icon{box-shadow:0 8px 32px rgba(51,115,255,.3)!important}
#globalLoader.light-mode .loader-percent{color:#1e293b!important}
#globalLoader.light-mode .loader-tip{color:rgba(0,0,0,.5)!important}
#globalLoader.light-mode .loader-progress-info span:first-child{color:rgba(0,0,0,.4)!important}
#globalLoader.light-mode .loader-theme-label{color:rgba(0,0,0,.6)!important}
</style>
<style>
/* 全局主题切换小太阳（固定右上角，始终可见） */
.global-sun-btn{position:fixed;top:16px;right:16px;z-index:999999;width:42px;height:42px;border-radius:50%;border:2px solid rgba(255,200,50,.7);background:linear-gradient(135deg,#ffd700,#ff8c00);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 12px rgba(255,165,0,.5);transition:all .3s;animation:globalSunSpin 6s linear infinite;backdrop-filter:blur(4px)}
.global-sun-btn:hover{transform:scale(1.15) rotate(15deg);box-shadow:0 4px 20px rgba(255,165,0,.8);animation-play-state:paused}
@keyframes globalSunSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
/* 深色模式：用 filter 反转整个页面颜色 */
body.theme-dark{filter:invert(1) hue-rotate(180deg)}
body.theme-dark img,body.theme-dark video,body.theme-dark canvas,body.theme-dark iframe{filter:invert(1) hue-rotate(180deg)}
/* 深色模式下小太阳保持原色 */
body.theme-dark .global-sun-btn{filter:invert(1) hue-rotate(180deg)}
</style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-300">

<button class="global-sun-btn" id="globalSunBtn" title="切换深色/浅色模式">☀️</button>

<div id="globalLoader">
  <div class="loader-logo">
    <div class="loader-logo-icon">◆</div>
    <span>餐厅学生管理系统</span>
  </div>
  <div class="loader-progress-wrap">
    <div class="loader-progress-bar"><div class="loader-progress-fill" id="loaderFill"></div></div>
    <div class="loader-progress-info">
      <span style="color:rgba(255,255,255,.4);font-size:12px;">正在加载资源</span>
      <span class="loader-percent" id="loaderPercent">0%</span>
    </div>
  </div>
  <div class="loader-tip" id="loaderTip">正在初始化引擎...</div>
  <div class="loader-theme-switcher">
    <button class="loader-sun-btn" id="loaderSunBtn" title="切换浅色模式">☀️</button>
    <span class="loader-theme-label">切换主题</span>
    <button class="loader-theme-btn" id="loaderThemeBtn" title="切换背景色">🎨</button>
    <div class="loader-theme-colors" id="loaderThemeColors"> id="loaderThemeColors">
      <button class="loader-theme-color active" data-theme="deepspace" style="background:linear-gradient(135deg,#0f172a,#1e1b4b)" title="深空蓝"></button>
      <button class="loader-theme-color" data-theme="aurora" style="background:linear-gradient(135deg,#064e3b,#134e4a)" title="极光绿"></button>
      <button class="loader-theme-color" data-theme="sunset" style="background:linear-gradient(135deg,#7c2d12,#9a3412)" title="落日橙"></button>
      <button class="loader-theme-color" data-theme="sakura" style="background:linear-gradient(135deg,#831843,#9d174d)" title="樱花粉"></button>
      <button class="loader-theme-color" data-theme="royal" style="background:linear-gradient(135deg,#2e1065,#4c1d95)" title="皇家紫"></button>
      <button class="loader-theme-color" data-theme="ocean" style="background:linear-gradient(135deg,#0c4a6e,#075985)" title="海洋蓝"></button>
    </div>
  </div>
</div>
    <div id="app">
        <!--登录-->
        <div id="login-box" class="min-h-screen flex items-center justify-center p-4">
            <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">
                <h2 class="text-2xl font-bold text-center mb-6">🍽️ 餐厅学生管理系统</h2>
                <div class="mb-4">
                    <label class="block mb-1">账号</label>
                    <input id="login-user" class="w-full border dark:border-gray-600 rounded px-3 py-2 bg-transparent" placeholder="输入账号">
                </div>
                <div class="mb-4">
                    <label class="block mb-1">密码</label>
                    <input id="login-pwd" type="password" class="w-full border dark:border-gray-600 rounded px-3 py-2 bg-transparent" placeholder="输入密码">
                </div>
                <button onclick="login()" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-2 rounded mb-3">登录</button>
                <button onclick="showRegister()" class="w-full border dark:border-gray-600 py-2 rounded">没有账号？去注册</button>
                <div class="mt-3 flex justify-end">
                    <button onclick="toggleTheme()">切换昼夜模式</button>
                </div>
            </div>
        </div>

        <!--注册-->
        <div id="register-box" class="hidden min-h-screen flex items-center justify-center p-4">
            <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">
                <h2 class="text-2xl font-bold text-center mb-6">学生账号注册</h2>
                <div class="mb-4">
                    <label class="block mb-1">账号</label>
                    <input id="reg-user" class="w-full border dark:border-gray-600 rounded px-3 py-2 bg-transparent" placeholder="创建账号">
                </div>
                <div class="mb-4">
                    <label class="block mb-1">密码</label>
                    <input id="reg-pwd" type="password" class="w-full border dark:border-gray-600 rounded px-3 py-2 bg-transparent" placeholder="创建密码">
                </div>
                <button onclick="register()" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-2 rounded mb-3">注册</button>
                <button onclick="showLogin()" class="w-full border dark:border-gray-600 py-2 rounded">返回登录</button>
            </div>
        </div>
    </div>

<script>
function showRegister(){
    document.getElementById("login-box").classList.add("hidden");
    document.getElementById("register-box").classList.remove("hidden");
}
function showLogin(){
    document.getElementById("register-box").classList.add("hidden");
    document.getElementById("login-box").classList.remove("hidden");
}

function login(){
    const u = document.getElementById("login-user").value.trim();
    const p = document.getElementById("login-pwd").value.trim();
    if(!u||!p){
        alert("账号密码不能为空");
        return;
    }
    //管理员
    if(u === ADMIN_ACCOUNT && p === ADMIN_PWD){
        localStorage.setItem("currentUser", ADMIN_ACCOUNT);
        addLoginLog(u);
        location.href="admin.html";
        return;
    }
    //学生
    const users = getUserList();
    const stu = users.find(item=>item.username === u);
    if(!stu){
        alert("账号不存在");
        return;
    }
    if(stu.password !== p){
        alert("密码错误");
        return;
    }
    localStorage.setItem("currentUser", u);
    addLoginLog(u);
    location.href="student.html";
}

function register(){
    const u = document.getElementById("reg-user").value.trim();
    const p = document.getElementById("reg-pwd").value.trim();
    if(!u||!p){
        alert("账号密码不能为空");
        return;
    }
    if(u === ADMIN_ACCOUNT){
        alert("该账号禁止注册！");
        return;
    }
    const users = getUserList();
    if(users.find(x=>x.username === u)){
        alert("账号已存在");
        return;
    }
    users.push({
        username:u,
        password:p,
        avatar:"" //头像base64，初始空
    });
    saveUserList(users);
    alert("注册成功，请登录");
    showLogin();
}
</script>

<script>
(function(){
  var fill=document.getElementById("loaderFill");
  var percentEl=document.getElementById("loaderPercent");
  var tipEl=document.getElementById("loaderTip");
  var progress=0,timer=null;
  var tips=["正在初始化引擎...","正在加载核心模块...","正在连接数据服务...","正在渲染界面组件...","即将完成，请稍候..."];
  var tipIndex=0;
  function setProgress(p){progress=Math.min(100,Math.max(0,p));if(fill)fill.style.width=progress+"%";if(percentEl)percentEl.textContent=Math.floor(progress)+"%";}
  function nextTip(){tipIndex=(tipIndex+1)%tips.length;if(tipEl){tipEl.style.opacity="0";setTimeout(function(){tipEl.textContent=tips[tipIndex];tipEl.style.opacity="1";},300);}}
  function simulate(){
    if(progress>=92)return;
    var inc=progress<30?Math.random()*8+4:progress<60?Math.random()*5+2:Math.random()*2+0.5;
    setProgress(progress+inc);
    if(Math.floor(progress/20)!==tipIndex&&progress<90)nextTip();
    timer=setTimeout(simulate,200+Math.random()*300);
  }
  window.__loaderComplete=function(){
    if(timer)clearTimeout(timer);
    setProgress(100);
    if(tipEl)tipEl.textContent="加载完成！";
    setTimeout(function(){
      var loader=document.getElementById("globalLoader");
      if(loader)loader.classList.add("loader-hide");
      setTimeout(function(){if(loader)loader.style.display="none";},600);
    },400);
  };
  setTimeout(function(){if(progress<100)window.__loaderComplete();},6000);
  simulate();
  var themes={deepspace:"linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%)",aurora:"linear-gradient(135deg,#064e3b 0%,#134e4a 50%,#064e3b 100%)",sunset:"linear-gradient(135deg,#7c2d12 0%,#9a3412 50%,#7c2d12 100%)",sakura:"linear-gradient(135deg,#831843 0%,#9d174d 50%,#831843 100%)",royal:"linear-gradient(135deg,#2e1065 0%,#4c1d95 50%,#2e1065 100%)",ocean:"linear-gradient(135deg,#0c4a6e 0%,#075985 50%,#0c4a6e 100%)"};
  var savedTheme=localStorage.getItem("loaderTheme")||"deepspace";
  var loaderEl=document.getElementById("globalLoader");
  if(loaderEl&&themes[savedTheme])loaderEl.style.background=themes[savedTheme];
  var themeBtn=document.getElementById("loaderThemeBtn");
  var themeColors=document.getElementById("loaderThemeColors");
  if(themeBtn&&themeColors){
    themeBtn.addEventListener("click",function(e){e.stopPropagation();themeColors.classList.toggle("show");});
    document.addEventListener("click",function(){themeColors.classList.remove("show");});
    var colorBtns=themeColors.querySelectorAll(".loader-theme-color");
    colorBtns.forEach(function(btn){
      if(btn.dataset.theme===savedTheme)btn.classList.add("active");else btn.classList.remove("active");
      btn.addEventListener("click",function(e){
        e.stopPropagation();
        var t=btn.dataset.theme;
        if(loaderEl&&themes[t])loaderEl.style.background=themes[t];
        localStorage.setItem("loaderTheme",t);
        colorBtns.forEach(function(b){b.classList.remove("active");});
        btn.classList.add("active");
      });
    });
  }
  /* ===== 小太阳浅色模式切换 ===== */
  var sunBtn=document.getElementById("loaderSunBtn");
  var savedLight=localStorage.getItem("loaderLight")==="true";
  if(savedLight&&loaderEl)loaderEl.classList.add("light-mode");
  if(sunBtn){
    sunBtn.addEventListener("click",function(e){
      e.stopPropagation();
      var isLight=loaderEl.classList.toggle("light-mode");
      localStorage.setItem("loaderLight",isLight?"true":"false");
    });
  }
  window.addEventListener("load",function(){setTimeout(function(){if(window.__loaderComplete)window.__loaderComplete();},800);});
})();
</script>
<script>
(function(){
  var btn=document.getElementById("globalSunBtn");
  var isDark=localStorage.getItem("globalThemeDark")==="true";
  if(isDark)document.body.classList.add("theme-dark");
  if(btn){
    btn.addEventListener("click",function(e){
      e.stopPropagation();
      var dark=document.body.classList.toggle("theme-dark");
      localStorage.setItem("globalThemeDark",dark?"true":"false");
    });
  }
})();
</script>

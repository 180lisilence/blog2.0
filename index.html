<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扫码登录 · 项目中心</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 420px;
      max-width: 100%;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      padding: 40px 36px 36px;
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      color: #fff;
      font-size: 28px;
      font-weight: 700;
    }
    h1 { font-size: 22px; color: #1f2937; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #9ca3af; margin-bottom: 24px; }

    .qr-wrap {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 0 auto 20px;
      border-radius: 18px;
      padding: 12px;
      background: #fff;
      border: 1px solid #e5e7eb;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }
    #qrImg { width: 100%; height: 100%; border-radius: 10px; display: block; }
    .qr-mask {
      position: absolute;
      inset: 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      color: #4b5563;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }
    .qr-mask.show { opacity: 1; }

    .status {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 15px;
      color: #374151;
      margin-bottom: 8px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
    .dot.pending { background: #f59e0b; animation: pulse 1.2s infinite; }
    .dot.scanned { background: #3b82f6; animation: pulse 1.2s infinite; }
    .dot.confirmed { background: #10b981; }
    .dot.expired, .dot.invalid { background: #ef4444; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

    .countdown { font-size: 12px; color: #9ca3af; }
    .steps {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      font-size: 12px;
      color: #9ca3af;
    }
    .step { display: flex; align-items: center; gap: 4px; }
    .step i { width: 18px; height: 18px; border-radius: 50%; background: #e5e7eb; color: #fff; font-style: normal; font-size: 11px; line-height: 18px; }
    .step.active i { background: #667eea; }
    .step.done i { background: #10b981; }
    .footer { margin-top: 18px; font-size: 12px; color: #c3c7d1; }
    .tip-bar {
      font-size: 13px;
      color: #6b7280;
      background: #f3f4f6;
      border-radius: 10px;
      padding: 10px 14px;
      line-height: 1.6;
      text-align: left;
    }
    .guest-btn {
      margin-top: 14px;
      width: 100%;
      padding: 12px;
      border: 1px dashed #c3c7d1;
      border-radius: 12px;
      background: #fff;
      color: #9ca3af;
      font-size: 13px;
      cursor: pointer;
      transition: all .2s;
    }
    .guest-btn:hover { color: #4f46e5; border-color: #667eea; background: #f5f7ff; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">M</div>
  <h1>扫码登录</h1>
  <div class="sub">请使用手机扫码，登录后可进入项目中心</div>

  <div class="qr-wrap">
    <img id="qrImg" alt="二维码" />
    <div class="qr-mask" id="qrMask">
      <div style="font-size:40px" id="maskIcon">✅</div>
      <div id="maskText">登录成功</div>
    </div>
  </div>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="tip">正在加载二维码...</span>
  </div>
  <div class="countdown" id="countdown"></div>

  <div class="steps" id="steps">
    <div class="step" id="st1"><i>1</i> 扫码</div>
    <div class="step" id="st2"><i>2</i> 手机确认</div>
    <div class="step" id="st3"><i>3</i> 进入系统</div>
  </div>

  <div class="tip-bar">
    💡 手机扫码后，使用<strong>自己注册的账号</strong>登录；没有账号可在手机页直接注册。
  </div>

  <button class="guest-btn" onclick="guestEnter()" title="无法启动后台服务时，跳过登录直接进入博客（访客模式）">
    ⚡ 无法连接服务？点此直接进入博客
  </button>
</div>

<script>
  let qid = null;
  let pollTimer = null;
  let countdownTimer = null;
  let expireAt = 0;

  // 兜底入口：无法启动后台服务时，跳过登录直接进入博客（访客模式）
  function guestEnter() {
    // 写访客标记：服务端在跑时凭此放行 /blog；本地打包(无服务)时不影响
    try { document.cookie = "web_guest=1; path=/; max-age=604800; SameSite=Lax"; } catch (e) {}
    // 用相对路径跳转：服务端下解析为 /blog/index.html，本地/APP 打包下直接打开本地 blog/index.html
    location.href = "blog/index.html";
  }

  async function initQr() {
    clearInterval(pollTimer);
    clearInterval(countdownTimer);
    hideMask();
    setStatus("正在加载二维码...", "pending");
    try {
      const resp = await fetch("/api/qrcode/generate");
      const data = await resp.json();
      if (!data.qid) throw new Error("生成失败");
      qid = data.qid;
      expireAt = Date.now() + data.expireSeconds * 1000;
      document.querySelector("#qrImg").src = data.qrBase64;
      document.querySelector("#qrImg").style.opacity = "1";
      resetSteps();
      startCountdown(data.expireSeconds);
      startPoll();
    } catch (e) {
      setStatus("二维码加载失败，请检查服务是否启动", "invalid");
    }
  }

  function setStatus(text, cls) {
    const dot = document.querySelector("#dot");
    dot.className = "dot " + cls;
    document.querySelector("#tip").innerText = text;
  }

  function hideMask() {
    document.querySelector("#qrMask").classList.remove("show");
  }
  function showMask(icon, text) {
    document.querySelector("#maskIcon").innerText = icon;
    document.querySelector("#maskText").innerText = text;
    document.querySelector("#qrMask").classList.add("show");
  }

  function setStep(i, cls) {
    document.querySelector("#st" + i).className = "step " + cls;
  }
  function resetSteps() {
    setStep(1, "active"); setStep(2, ""); setStep(3, "");
  }

  function startCountdown(seconds) {
    let left = seconds;
    document.querySelector("#countdown").innerText = `二维码 ${left}s 后过期`;
    countdownTimer = setInterval(() => {
      left--;
      if (left < 0) {
        clearInterval(countdownTimer);
        document.querySelector("#countdown").innerText = "";
        return;
      }
      document.querySelector("#countdown").innerText = `二维码 ${left}s 后过期`;
    }, 1000);
  }

  function startPoll() {
    clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      try {
        const res = await fetch(`/api/qrcode/check?qid=${qid}`);
        const ret = await res.json();
        switch (ret.status) {
          case "pending":
            setStatus("等待手机扫码", "pending");
            break;
          case "scanned":
            setStatus("已扫码！请在手机页面确认登录", "scanned");
            setStep(1, "done"); setStep(2, "active");
            break;
          case "confirmed":
            clearInterval(pollTimer);
            clearInterval(countdownTimer);
            setStatus("登录成功，正在进入系统...", "confirmed");
            setStep(1, "done"); setStep(2, "done"); setStep(3, "active");
            showMask("✅", "登录成功");
            // 写入登录 Cookie（服务端凭此放行博客全部页面），并进入站点
            document.cookie = "web_token=" + encodeURIComponent(ret.webToken) + "; path=/; max-age=604800; SameSite=Lax";
            setTimeout(() => { location.href = "/blog/"; }, 900);
            break;
          case "expired":
            clearInterval(pollTimer);
            setStatus("二维码已过期，正在刷新...", "expired");
            setTimeout(initQr, 1200);
            break;
          case "invalid":
            clearInterval(pollTimer);
            setStatus("会话无效，正在刷新...", "invalid");
            setTimeout(initQr, 1200);
            break;
        }
      } catch (e) { /* 忽略瞬时网络错误 */ }
    }, 1100);
  }

  // 若已登录过（Cookie 有效），直接进入站点
  (async () => {
    try {
      const r = await fetch("/api/me");
      const d = await r.json();
      if (d.ok) {
        // 显示已登录状态，可直接进入系统或切换账号
        const bar = document.createElement("div");
        bar.style.cssText = "margin-bottom:18px;padding:12px 14px;border-radius:12px;background:#ecfdf5;color:#047857;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;";
        bar.innerHTML = '<span>✅ 已登录：<b>' + d.username + '</b>（7 天内免登录）</span>';
        const wrap = document.createElement("div");
        wrap.style.cssText = "display:flex;gap:8px;";
        wrap.innerHTML = '<button id="goIn" style="border:none;background:#10b981;color:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;">进入系统</button>' +
                         '<button id="switchAcc" style="border:1px solid #d1d5db;background:#fff;color:#374151;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;">退出 / 换账号</button>';
        bar.appendChild(wrap);
        document.querySelector(".card").insertBefore(bar, document.querySelector(".logo"));
        document.querySelector("#goIn").onclick = () => { location.href = "/blog/"; };
        document.querySelector("#switchAcc").onclick = async () => {
          const cur = document.cookie.split(";").map(s => s.trim()).find(s => s.startsWith("web_token="));
          const t = cur ? decodeURIComponent(cur.split("=").slice(1).join("=")) : "";
          try { await fetch("/api/logout", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: t }) }); } catch (e) {}
          document.cookie = "web_token=; path=/; max-age=0";
          document.cookie = "web_guest=; path=/; max-age=0";
          location.reload();
        };
        return;
      }
    } catch (e) {}
    initQr();
  })();
</script>
</body>
</html>

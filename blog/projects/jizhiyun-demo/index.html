<script>
window.App = window.App || {};

App.toggleTheme = function() {
  var isDark = document.documentElement.classList.toggle('dark');
  App.Store.set('darkMode', isDark);
};

App.setThemeColor = function(color) {
  document.documentElement.style.setProperty('--brand-color', color);
  App.Store.set('themeColor', color);
};

/* ===== 加载进度条控制器 ===== */
(function() {
  var fill = document.getElementById('loaderFill');
  var percentEl = document.getElementById('loaderPercent');
  var tipEl = document.getElementById('loaderTip');
  var progress = 0;
  var timer = null;
  var tips = [
    '正在初始化引擎...',
    '正在加载核心模块...',
    '正在连接数据服务...',
    '正在渲染界面组件...',
    '即将完成，请稍候...'
  ];
  var tipIndex = 0;

  function setProgress(p) {
    progress = Math.min(100, Math.max(0, p));
    if (fill) fill.style.width = progress + '%';
    if (percentEl) percentEl.textContent = Math.floor(progress) + '%';
  }

  function nextTip() {
    tipIndex = (tipIndex + 1) % tips.length;
    if (tipEl) {
      tipEl.style.opacity = '0';
      setTimeout(function() {
        tipEl.textContent = tips[tipIndex];
        tipEl.style.opacity = '1';
      }, 300);
    }
  }

  // 模拟进度增长（先快后慢，到 92% 等待真正完成）
  function simulate() {
    if (progress >= 92) return;
    var increment;
    if (progress < 30) increment = Math.random() * 8 + 4;
    else if (progress < 60) increment = Math.random() * 5 + 2;
    else increment = Math.random() * 2 + 0.5;
    setProgress(progress + increment);
    if (Math.floor(progress / 20) !== tipIndex && progress < 90) nextTip();
    timer = setTimeout(simulate, 200 + Math.random() * 300);
  }

  // 页面加载完成后，进度冲到 100% 并淡出
  window.__loaderComplete = function() {
    if (timer) clearTimeout(timer);
    setProgress(100);
    if (tipEl) tipEl.textContent = '加载完成！';
    setTimeout(function() {
      var loader = document.getElementById('globalLoader');
      if (loader) loader.classList.add('loader-hide');
      setTimeout(function() { if (loader) loader.style.display = 'none'; }, 600);
    }, 400);
  };

  // 兜底：最多 8 秒强制完成
  setTimeout(function() { if (progress < 100) window.__loaderComplete(); }, 8000);

  // 启动模拟
  simulate();

  /* ===== 颜色切换 ===== */
  var themes = {
    deepspace: 'linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#0f172a 100%)',
    aurora: 'linear-gradient(135deg,#064e3b 0%,#134e4a 50%,#064e3b 100%)',
    sunset: 'linear-gradient(135deg,#7c2d12 0%,#9a3412 50%,#7c2d12 100%)',
    sakura: 'linear-gradient(135deg,#831843 0%,#9d174d 50%,#831843 100%)',
    royal: 'linear-gradient(135deg,#2e1065 0%,#4c1d95 50%,#2e1065 100%)',
    ocean: 'linear-gradient(135deg,#0c4a6e 0%,#075985 50%,#0c4a6e 100%)'
  };
  var savedTheme = localStorage.getItem('loaderTheme') || 'deepspace';
  var loaderEl = document.getElementById('globalLoader');
  if (loaderEl && themes[savedTheme]) loaderEl.style.background = themes[savedTheme];

  var themeBtn = document.getElementById('loaderThemeBtn');
  var themeColors = document.getElementById('loaderThemeColors');
  if (themeBtn && themeColors) {
    themeBtn.addEventListener('click', function(e) { e.stopPropagation(); themeColors.classList.toggle('show'); });
    document.addEventListener('click', function() { themeColors.classList.remove('show'); });
    var colorBtns = themeColors.querySelectorAll('.loader-theme-color');
    colorBtns.forEach(function(btn) {
      if (btn.dataset.theme === savedTheme) btn.classList.add('active'); else btn.classList.remove('active');
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var t = btn.dataset.theme;
        if (loaderEl && themes[t]) loaderEl.style.background = themes[t];
        localStorage.setItem('loaderTheme', t);
        colorBtns.forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
      });
    });
  }
})();

try {
  var isDark = App.Store.get('darkMode') === 'true';
  if (isDark) document.documentElement.classList.add('dark');
  var themeColor = App.Store.get('themeColor') || '#3373ff';
  App.setThemeColor(themeColor);
  
  App.Components.renderNavbar();
  App.Components.renderFooter();
  App.Router.init();
  
  // 路由首次渲染完成后，标记加载完成
  setTimeout(function() { if (window.__loaderComplete) window.__loaderComplete(); }, 800);
} catch (e) {
  document.getElementById('app').innerHTML = '<div style="padding:100px;text-align:center;color:red;"><h2>500 错误</h2><p>' + e.message + '</p><pre>' + e.stack + '</pre></div>';
  if (window.__loaderComplete) window.__loaderComplete();
}
</script>

/* 颜色切换 */
.loader-theme-switcher{position:absolute;bottom:40px;right:40px;z-index:10;display:flex;align-items:center;gap:10px}

<!-- sun-drag -->
<style>
.global-sun-btn{cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.global-sun-btn.dragging{cursor:grabbing;transition:none!important;animation-play-state:paused!important;box-shadow:0 8px 24px rgba(255,165,0,.85)!important}
</style>
<script>
(function(){
  var btn=document.getElementById("globalSunBtn");
  if(!btn)return;
  btn.title="切换主题 · 按住可拖动位置";
  var KEY="globalSunPos",x=null,y=null;
  try{var s=localStorage.getItem(KEY);if(s){var p=JSON.parse(s);if(typeof p.x==="number"&&typeof p.y==="number"){x=p.x;y=p.y;}}}catch(e){}
  function clamp(){var w=btn.offsetWidth||42,h=btn.offsetHeight||42;x=Math.max(0,Math.min(x,window.innerWidth-w));y=Math.max(0,Math.min(y,window.innerHeight-h));}
  function render(noAnim){if(x===null||y===null)return;clamp();if(noAnim)btn.style.transition="none";btn.style.left=x+"px";btn.style.top=y+"px";btn.style.right="auto";btn.style.bottom="auto";if(noAnim)requestAnimationFrame(function(){btn.style.transition="";});}
  render(true);
  window.addEventListener("resize",function(){if(x!==null&&y!==null)render(false);});
  var dragging=false,moved=false,sx=0,sy=0,ox=0,oy=0;
  btn.addEventListener("pointerdown",function(e){dragging=true;moved=false;if(btn.setPointerCapture)btn.setPointerCapture(e.pointerId);btn.classList.add("dragging");sx=e.clientX;sy=e.clientY;var r=btn.getBoundingClientRect();ox=r.left;oy=r.top;x=ox;y=oy;});
  btn.addEventListener("pointermove",function(e){if(!dragging)return;var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;x=ox+dx;y=oy+dy;render(false);});
  function end(){if(!dragging)return;dragging=false;btn.classList.remove("dragging");try{localStorage.setItem(KEY,JSON.stringify({x:x,y:y}));}catch(e){}}
  btn.addEventListener("pointerup",end);
  btn.addEventListener("pointercancel",end);
  btn.addEventListener("click",function(e){if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);
})();
</script>
